<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de la compra</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <h1>Lista de la compra</h1>
    </header>
    <main>
        <div id="form">
            <label for="nombre-prod">Nombre del producto</label>
            <input type="text" id="nombre-prod" /><br>
            <label for="precio-unidad">Precio por unidad</label>
            <input type="number" id="precio-unidad" /><br>
            <label for="cantidad-prod">Cantidad</label>
            <input type="number" id="cantidad-prod" /><br>
            <button onclick="aniadirProducto()">Añadir</button>
        </div>
        <div id="contendor">
            <!-- Aquí se genera cada producto añadido -->
            <table id="productos"></table>
            <!-- Debajo, el subtotal -->
            <table id="subtotal"></table>
        </div>
    </main>
    <footer>
        <p>&copy;g-lin-al - 2026</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
